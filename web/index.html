<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SignalForge — mesh intelligence for the airwaves around you.">
  <title>SignalForge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2367ea94'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23101418'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header id="topbar">
    <div class="brand"><span class="logo"></span><span>SignalForge</span><small>mesh intelligence</small></div>
    <nav id="pagenav" role="tablist" aria-label="Pages"></nav>
    <div id="me" class="pill" title="The radio connected to this computer">no radio</div>
    <div id="counts" class="pill"></div>
    <div id="follows" class="pill hidden" title="Topics being followed for the remote node"></div>
    <div id="status" class="pill status-off" role="status">connecting…</div>
    <div class="spacer"></div>
    <div class="seg" id="viewseg" role="tablist" aria-label="Main view">
      <button id="view-cmd" role="tab" class="active">◈ Command Center</button>
      <button id="view-map" role="tab">Map</button>
    </div>
    <button id="btn-unread" class="pill unread hidden" title="Open the newest unread conversation"></button>
    <button id="btn-theme" class="icon" title="Switch light/dark theme" aria-label="Switch theme">◐</button>
  </header>
  <div id="banner" class="banner hidden" role="alert"></div>

  <main id="layout">
    <aside id="left" class="panel">
      <nav class="tabs" role="tablist">
        <button id="tab-nodes" role="tab" class="active" data-tab="nodes">Nodes <span id="nodes-count" class="count"></span></button>
        <button id="tab-chats" role="tab" data-tab="chats">Chats <span id="chats-badge" class="badge hidden"></span></button>
        <button id="tab-air" role="tab" data-tab="air">Air <span id="air-count" class="badge live hidden"></span></button>
        <button id="tab-radio" role="tab" data-tab="radio">Radio <span id="radio-live" class="badge live hidden">●</span></button>
      </nav>
      <section id="pane-nodes" class="pane">
        <div class="tools">
          <input id="search" type="search" placeholder="Search name or ID" autocomplete="off" aria-label="Search nodes">
          <div id="chips" class="chips">
            <button class="chip active" data-filter="all">All</button>
            <button class="chip" data-filter="live">Live</button>
            <button class="chip" data-filter="direct">Direct</button>
            <button class="chip" data-filter="mapped">On map</button>
          </div>
        </div>
        <ul id="node-list" class="list"></ul>
      </section>
      <section id="pane-chats" class="pane hidden">
        <ul id="chat-list" class="list"></ul>
      </section>
      <section id="pane-air" class="pane hidden">
        <div class="tools">
          <div class="radio-head">
            <button id="btn-air" class="chip">Start tracking</button>
            <span id="air-status" class="dim"></span>
          </div>
          <div id="air-error" class="radio-error hidden" role="alert"></div>
          <div id="air-ref" class="dim"></div>
        </div>
        <ul id="air-list" class="list"></ul>
      </section>
      <section id="pane-radio" class="pane hidden">
        <div class="tools">
          <div class="radio-head">
            <button id="btn-radio" class="chip">Start survey</button>
            <span id="radio-status" class="dim"></span>
          </div>
          <div id="radio-error" class="radio-error hidden" role="alert"></div>
          <form id="radio-form" class="radio-form" autocomplete="off">
            <input id="radio-mhz" type="text" inputmode="decimal" placeholder="Listen to MHz (e.g. 146.520)" aria-label="Frequency in MHz">
            <button id="btn-listen" type="submit" class="chip">▶ Listen</button>
          </form>
          <audio id="radio-audio" controls preload="none"></audio>
          <div id="radio-now" class="dim"></div>
        </div>
        <ul id="radio-list" class="list"></ul>
      </section>
    </aside>

    <section id="mapwrap">
      <div id="map" class="dmap" aria-label="Map of nodes"></div>
      <section id="command" class="command" aria-label="Command center"></section>
      <div id="mapnote" class="mapnote hidden"></div>
    </section>

    <aside id="right" class="panel">
      <section id="detail" class="card"></section>
      <section id="chat">
        <header id="chat-head"></header>
        <div id="thread" class="thread" aria-live="polite"></div>
        <form id="composer" autocomplete="off">
          <textarea id="msg-input" rows="2" placeholder="Pick a conversation" aria-label="Message" disabled></textarea>
          <div class="composer-row">
            <span id="byte-count" class="dim"></span>
            <button id="btn-send" type="submit" disabled>Send</button>
          </div>
        </form>
      </section>
    </aside>
  </main>

  <div id="toasts" aria-live="polite"></div>
  <script src="/assets/vendor/leaflet/leaflet.js"></script>
  <script src="/assets/pages.js"></script>
  <script src="/assets/page-air.js"></script>
  <script src="/assets/page-radio.js"></script>
  <script src="/assets/page-weather.js"></script>
  <script src="/assets/page-decode.js"></script>
  <script src="/assets/page-sky.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
